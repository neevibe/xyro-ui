<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>XYRO Core</title>
<style>
  :root { --bg:#020203; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:var(--bg); overflow:hidden; cursor:none; }
  canvas { display:block; }
  #ui {
    position:fixed; inset:0; pointer-events:none;
    font-family:-apple-system,"SF Pro Display",Inter,system-ui,sans-serif;
    color:#eaf6ff;
  }
  .wordmark {
    position:absolute; top:38px; left:50%; transform:translateX(-50%);
    font-weight:600; letter-spacing:.62em; font-size:13px;
    color:rgba(180,220,255,.55); text-indent:.62em;
    opacity:0; animation:fade 1.4s 1.2s forwards;
  }
  .tagline {
    position:absolute; bottom:118px; left:50%; transform:translateX(-50%);
    font-weight:300; letter-spacing:.28em; font-size:11px;
    color:rgba(150,190,225,.4); text-transform:uppercase; text-indent:.28em;
    opacity:0; animation:fade 1.6s 1.8s forwards; white-space:nowrap;
  }
  #state-label {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%) translateY(-190px);
    font-weight:300; letter-spacing:.34em; font-size:10.5px; text-transform:uppercase;
    color:rgba(120,235,255,.72); text-indent:.34em;
    transition:opacity .5s, color .6s;
  }
  #dock {
    position:absolute; bottom:46px; left:50%; transform:translateX(-50%);
    display:flex; gap:10px; pointer-events:auto;
    opacity:0; animation:fade 1.2s 2.2s forwards;
  }
  .chip {
    font:500 11px/1 -apple-system,Inter,sans-serif; letter-spacing:.12em;
    text-transform:uppercase; color:rgba(200,225,245,.6);
    padding:11px 18px; border-radius:100px; cursor:pointer;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(140,190,235,.14);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    transition:.35s cubic-bezier(.2,.8,.2,1);
  }
  .chip:hover { color:#eaf9ff; border-color:rgba(120,220,255,.5);
    background:rgba(90,180,255,.09); transform:translateY(-2px); }
  .chip.active { color:#eafcff; border-color:rgba(120,225,255,.7);
    background:rgba(80,190,255,.14); box-shadow:0 0 26px rgba(70,190,255,.25); }
  #cursor {
    position:fixed; width:26px; height:26px; border-radius:50%; pointer-events:none;
    margin:-13px 0 0 -13px; z-index:50; mix-blend-mode:screen;
    background:radial-gradient(circle, rgba(130,225,255,.9) 0%, rgba(120,180,255,.25) 45%, transparent 70%);
    transition:width .3s, height .3s, opacity .3s;
  }
  @keyframes fade { to { opacity:1; } }
  #hint { position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
    font:300 10px/1 Inter,sans-serif; letter-spacing:.18em; color:rgba(120,150,180,.35);
    text-transform:uppercase; opacity:0; animation:fade 2s 3s forwards; }
  /* A real chat transcript, not a single overwritten caption: messages stack
     and persist so a reply can be reviewed and copied, not just glimpsed. */
  #transcript { position:fixed; top:50%; right:36px; transform:translateY(-50%);
    width:min(380px, 36vw); max-height:74vh; overflow-y:auto;
    display:flex; flex-direction:column; gap:10px;
    font:400 14.5px/1.65 "SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    letter-spacing:.01em; opacity:0; pointer-events:none; }
  #transcript.show { pointer-events:auto; }
  #transcript .msg { position:relative; padding:14px 18px; border-radius:14px;
    background:rgba(6,14,20,.55); border:1px solid rgba(120,220,255,.16);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    box-shadow:0 0 24px rgba(0,0,0,.3), inset 0 0 0 1px rgba(255,255,255,.02);
    animation:msg-in .3s ease-out; }
  #transcript .msg.xyro { color:#c9f3ff; }
  #transcript .msg.user { color:rgba(180,215,245,.6); background:rgba(6,14,20,.32);
    border-color:rgba(120,220,255,.08); font-style:italic; }
  #transcript .msg.user.draft { opacity:.7; }
  #transcript .cursor { display:inline-block; width:8px; height:15px; margin-left:2px;
    background:#7ef0ff; vertical-align:-2px; animation:blink 0.9s steps(1) infinite; }
  #transcript .copy-btn { position:absolute; top:8px; right:10px; opacity:0;
    font:500 10px/1 -apple-system,Inter,sans-serif; letter-spacing:.08em; text-transform:uppercase;
    color:rgba(150,220,255,.7); background:rgba(255,255,255,.06); border:1px solid rgba(120,220,255,.2);
    border-radius:6px; padding:4px 8px; cursor:pointer; transition:opacity .2s, background .2s; }
  #transcript .msg.xyro:hover .copy-btn { opacity:1; }
  #transcript .copy-btn:hover { background:rgba(120,220,255,.18); }
  @keyframes msg-in { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @keyframes blink { 50% { opacity:0; } }
  @media (max-width: 860px) {
    #transcript { right:50%; transform:translate(50%, -50%); width:min(440px,88vw); }
  }
  #wakeprompt { position:absolute; bottom:150px; left:50%; transform:translateX(-50%);
    font:400 13px/1.8 -apple-system,Inter,sans-serif; letter-spacing:.06em; text-align:center;
    color:rgba(180,215,245,.55); transition:opacity .6s; }
  #wakeprompt span { font-size:11px; color:rgba(150,185,220,.35); letter-spacing:.1em; }
  #wakeprompt.hidden { opacity:0; }
  /* A fixed inset:0 div sized to the full (rectangular) viewport, combined with
     radial-gradient's default farthest-corner sizing, makes the falloff
     percentages relative to the DIAGONAL — so on any non-square window the
     short-axis edges land only partway through the fade (still glowing) while
     the long-axis edges are fully transparent. That asymmetric wash reads as
     a rectangular flash, not a circular one. Fix: size the element itself to
     a square based on the SMALLER viewport dimension (vmin), so the circle
     drawn inside it always fades to transparent well before any edge — a
     true circular pulse regardless of window shape. */
  .flash { position:fixed; top:50%; left:50%; pointer-events:none; z-index:40; opacity:0;
    width:130vmin; height:130vmin; transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle at 50% 50%, rgba(150,225,255,.55), rgba(120,180,255,.15) 35%, transparent 65%); }
</style>
</head>
<body>
<div id="ui">
  <div class="wordmark">X Y R O</div>
  <div id="state-label">Idle</div>
  <div class="tagline">The official AI companion of Xyrenis</div>
  <div id="dock">
    <div class="chip active" data-state="idle">Idle</div>
    <div class="chip" data-state="listening">Listening</div>
    <div class="chip" data-state="thinking">Thinking</div>
    <div class="chip" data-state="speaking">Speaking</div>
  </div>
  <div id="hint">move cursor · orb reacts</div>
  <div id="transcript"></div>
  <div id="wakeprompt">👏 clap &nbsp;or&nbsp; 🎙 say “Hello Xyro” &nbsp;to wake<br><span>(or click the orb)</span></div>
</div>
<div id="cursor"></div>

<script type="importmap">
{ "imports": {
  "three": "https://esm.sh/three@0.160.0",
  "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/",
  "@picovoice/porcupine-web": "https://esm.sh/@picovoice/porcupine-web@3",
  "@picovoice/web-voice-processor": "https://esm.sh/@picovoice/web-voice-processor@4"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { PorcupineWorker } from '@picovoice/porcupine-web';
import { WebVoiceProcessor } from '@picovoice/web-voice-processor';

/**
 * Wake-word config. The Web Speech "transcribe everything, regex-match it"
 * approach is fundamentally the wrong tool for wake-word spotting — it's
 * sentence-level dictation, not frame-level continuous listening, which is
 * why activation was unreliable and slow. Porcupine is purpose-built for
 * exactly this: a tiny model classifying audio frames continuously and
 * locally (WASM, in a Web Worker — genuinely low-power), typically
 * detecting a keyword in well under 300ms.
 *
 * "Xyro" isn't a built-in Porcupine keyword, so it needs a custom model —
 * free, but requires a one-time setup only Neeraj can do (Picovoice account
 * + training a keyword in their console). Until PICOVOICE_ACCESS_KEY and the
 * two model files below are in place, this silently no-ops and the existing
 * speech-recognition wake-word regex keeps working as the fallback — nothing
 * breaks in the meantime.
 */
const PICOVOICE_ACCESS_KEY = ''; // paste your AccessKey from console.picovoice.ai
const XYRO_KEYWORD_MODEL = 'xyro_keyword.ppn';      // downloaded from Picovoice Console
const PORCUPINE_BASE_MODEL = 'porcupine_params.pv'; // downloaded from the Porcupine repo
let porcupineWorker = null;

async function initWakeWordEngine(onWake) {
  if (!PICOVOICE_ACCESS_KEY) {
    console.log('Porcupine wake-word engine not configured — using speech-recognition fallback. See README for setup.');
    return false;
  }
  try {
    porcupineWorker = await PorcupineWorker.create(
      PICOVOICE_ACCESS_KEY,
      [{ publicPath: XYRO_KEYWORD_MODEL, label: 'xyro' }],
      () => onWake(),
      { publicPath: PORCUPINE_BASE_MODEL },
    );
    await WebVoiceProcessor.subscribe(porcupineWorker);
    console.log('Porcupine wake-word engine active — listening for "Xyro" locally.');
    return true;
  } catch (e) {
    console.warn('Porcupine init failed, falling back to speech-recognition wake-word:', e.message);
    return false;
  }
}

// Graceful degradation: if WebGL is unavailable (sandboxed/headless browser,
// ancient hardware, locked-down enterprise machine), fail visibly instead of
// silently — an uncaught exception here previously killed the ENTIRE script,
// including all click handlers and window.XYRO, with zero user feedback.
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
} catch (e) {
  document.body.innerHTML = `<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020203;color:#8fb8d6;font:300 15px/1.6 -apple-system,Inter,sans-serif;text-align:center;padding:40px;">
    XYRO needs WebGL, which this browser/device couldn't provide.<br>
    <span style="color:rgba(150,190,225,.5);font-size:12px;">${(e && e.message) || 'Unknown WebGL error'}</span></div>`;
  throw e; // still stop this script — but the page now explains why instead of going dead silently
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x020203, 0.055);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 6.2);

const rig = new THREE.Group(); scene.add(rig); // parallax rig

// ---- shared GLSL noise (Ashima simplex 3D) ----
const NOISE = `
vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x,289.0);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+1.0*C.xxx; vec3 x2=x0-i2+2.0*C.xxx; vec3 x3=x0-1.0+3.0*C.xxx;
  i=mod(i,289.0);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=1.0/7.0; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float fbm(vec3 p){ float f=0.0,a=0.5; for(int i=0;i<5;i++){ f+=a*snoise(p); p*=2.02; a*=0.5;} return f; }
`;

const uniforms = {
  uTime:{value:0}, uState:{value:0}, uAmp:{value:0.16}, uSpeed:{value:0.35},
  uPulse:{value:0}, uColorA:{value:new THREE.Color('#38e6ff')},
  uColorB:{value:new THREE.Color('#7a5cff')}, uColorC:{value:new THREE.Color('#39ffb0')},
};

// ---- energy core (displaced icosahedron) ----
const coreMat = new THREE.ShaderMaterial({
  uniforms, transparent:true,
  vertexShader:`
    ${NOISE}
    uniform float uTime,uAmp,uSpeed,uPulse;
    varying float vN; varying vec3 vPos; varying vec3 vNormal;
    void main(){
      vNormal = normal;
      float t = uTime*uSpeed;
      float n = fbm(normal*1.7 + vec3(t*0.6));
      float ripple = snoise(normal*4.0 + vec3(t*1.4)) * 0.35;
      float disp = (n + ripple) * uAmp + uPulse*0.22*sin(uTime*7.0 + n*4.0);
      vN = n;
      vec3 p = position + normal*disp;
      vPos = p;
      gl_Position = projectionMatrix*modelViewMatrix*vec4(p,1.0);
    }`,
  fragmentShader:`
    uniform float uTime; uniform vec3 uColorA,uColorB,uColorC; uniform float uState;
    varying float vN; varying vec3 vPos; varying vec3 vNormal;
    void main(){
      vec3 vd = normalize(cameraPosition - vPos);
      float fres = pow(1.0 - max(dot(vd, normalize(vNormal)),0.0), 2.6);
      float bands = 0.5 + 0.5*sin(vN*6.0 + uTime*1.4);
      vec3 col = mix(uColorB, uColorA, bands);
      col = mix(col, uColorC, smoothstep(0.4,1.0,vN)*0.4);
      float core = smoothstep(0.1,-0.5,vN)*0.35; // hot inner
      vec3 emit = col*(0.18+bands*0.28) + col*fres*1.15 + vec3(0.55,0.85,1.0)*core;
      float alpha = 0.14 + fres*0.6 + core*0.3;
      gl_FragColor = vec4(emit, alpha);
    }`,
});
const core = new THREE.Mesh(new THREE.IcosahedronGeometry(1.32, 128), coreMat);
core.material.blending = THREE.AdditiveBlending; core.material.depthWrite=false;
rig.add(core);

// inner solid nucleus for density
const nucleus = new THREE.Mesh(
  new THREE.IcosahedronGeometry(1.02, 64),
  new THREE.ShaderMaterial({ uniforms, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false,
    vertexShader:`${NOISE} uniform float uTime,uSpeed; varying float vN;
      void main(){ float n=fbm(normal*2.2+vec3(uTime*uSpeed*0.8)); vN=n;
      vec3 p=position+normal*n*0.06; gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}`,
    fragmentShader:`uniform vec3 uColorA,uColorB; varying float vN;
      void main(){ vec3 c=mix(uColorB,uColorA,0.5+0.5*vN); gl_FragColor=vec4(c*0.6,0.22*smoothstep(-0.3,0.6,vN));}`,
  })
);
rig.add(nucleus);

// ---- magnetic field rings ----
const rings = new THREE.Group(); rig.add(rings);
for(let i=0;i<3;i++){
  const r = new THREE.Mesh(
    new THREE.TorusGeometry(1.9+i*0.28, 0.006, 8, 220),
    new THREE.MeshBasicMaterial({ color: i%2? 0x7a5cff:0x38e6ff, transparent:true, opacity:0.32, blending:THREE.AdditiveBlending, depthWrite:false })
  );
  r.rotation.x = Math.PI*0.5 + (i-1)*0.42; r.rotation.y = i*0.6;
  r.userData.sx = 0.13+i*0.05; r.userData.sz = 0.09-i*0.03;
  rings.add(r);
}

// ---- neural particle field ----
const COUNT = 2600;
const pos = new Float32Array(COUNT*3), rand = new Float32Array(COUNT);
for(let i=0;i<COUNT;i++){
  const r = 1.7 + Math.pow(Math.random(),1.5)*3.4;
  const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
  pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pos[i*3+2]=r*Math.cos(ph);
  rand[i]=Math.random();
}
const pg = new THREE.BufferGeometry();
pg.setAttribute('position', new THREE.BufferAttribute(pos,3));
pg.setAttribute('aRand', new THREE.BufferAttribute(rand,1));
const particles = new THREE.Points(pg, new THREE.ShaderMaterial({
  uniforms, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false,
  vertexShader:`${NOISE} uniform float uTime,uState,uSpeed; attribute float aRand; varying float vA;
    void main(){
      vec3 p=position;
      float t=uTime*(0.15+uState*0.25);
      float sw=fbm(p*0.4+vec3(t)); p+=normalize(p)*sw*0.25*(0.5+uState);
      float ang=t*(0.2+aRand*0.4)*(1.0+uState*1.5);
      mat2 R=mat2(cos(ang),-sin(ang),sin(ang),cos(ang)); p.xz=R*p.xz;
      vec4 mv=modelViewMatrix*vec4(p,1.0);
      float d=length(position);
      vA=(1.0-smoothstep(2.2,5.2,d))*(0.25+0.4*aRand);
      gl_PointSize=clamp((0.6+aRand*1.3)*(1.0+uState*0.6)*(120.0/-mv.z), 1.0, 9.0);
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`uniform vec3 uColorA,uColorC; uniform float uState; varying float vA;
    void main(){ vec2 c=gl_PointCoord-0.5; float d=length(c); if(d>0.5)discard;
      float g=smoothstep(0.5,0.0,d); vec3 col=mix(uColorA,uColorC,uState*0.5);
      gl_FragColor=vec4(col, g*vA*0.55); }`,
}));
rig.add(particles);

// starfield backdrop
const sCount=900, sp=new Float32Array(sCount*3);
for(let i=0;i<sCount;i++){ sp[i*3]=(Math.random()-0.5)*40; sp[i*3+1]=(Math.random()-0.5)*40; sp[i*3+2]=(Math.random()-0.5)*40-8; }
const sg=new THREE.BufferGeometry(); sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color:0x6a8bb5, size:0.02, transparent:true, opacity:0.5 })));

// ---- postprocessing: bloom ----
// Render target must be sized in ACTUAL pixels (CSS size * devicePixelRatio)
// and multisampled — otherwise on any HiDPI screen the bloom's internal mip
// chain is built at half the real resolution while the main render is at
// full res, which shows up as blocky/boxy misalignment that gets worse
// whenever bloom strength changes (i.e. on every state transition).
const dpr = renderer.getPixelRatio();
const rtSize = new THREE.Vector2(innerWidth*dpr, innerHeight*dpr);
const renderTarget = new THREE.WebGLRenderTarget(rtSize.x, rtSize.y, { samples: 4 });
const composer = new EffectComposer(renderer, renderTarget);
composer.setPixelRatio(1); // render target is already in physical pixels
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(rtSize.clone(), 0.6, 0.55, 0.72);
composer.addPass(bloom);
// vignette — aspect-corrected so it's a true circle, not a box on wide/tall viewports
const vignette = new ShaderPass({
  uniforms:{ tDiffuse:{value:null}, uAspect:{value:innerWidth/innerHeight} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`uniform sampler2D tDiffuse; uniform float uAspect; varying vec2 vUv;
    void main(){ vec4 c=texture2D(tDiffuse,vUv);
      vec2 p=(vUv-0.5); p.x*=max(uAspect,1.0); p.y*=max(1.0/uAspect,1.0); // aspect-correct: circle stays a circle
      float d=length(p);
      c.rgb*=smoothstep(0.78,0.28,d); gl_FragColor=c; }`,
});
composer.addPass(vignette);

// ---- state machine ----
const STATES = {
  dormant:   { amp:0.06, speed:0.12, bloom:0.16, cA:'#2b4a63', cB:'#343f6e', ringSpin:0.28, scale:0.6 },
  idle:      { amp:0.14, speed:0.30, bloom:0.5,  cA:'#38e6ff', cB:'#7a5cff', ringSpin:1,    scale:1 },
  listening: { amp:0.30, speed:0.55, bloom:0.72, cA:'#39ffb0', cB:'#38e6ff', ringSpin:1.6,  scale:1.06 },
  thinking:  { amp:0.22, speed:1.35, bloom:0.85, cA:'#7a5cff', cB:'#38e6ff', ringSpin:3.4,  scale:1 },
  speaking:  { amp:0.26, speed:0.7,  bloom:0.78, cA:'#38e6ff', cB:'#8affff', ringSpin:2,     scale:1.03 },
};
let state='dormant', target=STATES.dormant, awake=false;
let rec=null, recWanted=true; // speech recognition instance + "should auto-restart" flag
let queryBuffer='', querySilenceTimer=null;
const QUERY_SILENCE_MS=1100; // pause length that finalizes a spoken query
const cur = { amp:0.06, speed:0.12, bloom:0.16, ringSpin:0.28, scale:0.6 };
const cA=new THREE.Color('#38e6ff'), cB=new THREE.Color('#7a5cff');
const tA=new THREE.Color('#38e6ff'), tB=new THREE.Color('#7a5cff');
function setState(s){
  state=s; target=STATES[s];
  tA.set(target.cA); tB.set(target.cB);

// Splits streamed text into complete sentences as they finish, so speech can
// start on sentence 1 while the model is still writing sentence 2+.
function makeSentencePipeliner(onSentence){
  let buffer = '';
  return {
    feed(delta){
      buffer += delta;
      const re = /[^.!?\n]*[.!?\n]+["')\]]*\s*/g;
      let consumed = 0;
      for (const m of buffer.matchAll(re)) {
        const sentence = m[0].trim();
        if (sentence.length > 1) onSentence(sentence);
        consumed = m.index + m[0].length;
      }
      buffer = buffer.slice(consumed);
    },
    flush(){ const rest=buffer.trim(); buffer=''; if(rest) onSentence(rest); },
  };
}

// Reveals text token-by-token on a fixed clock, independent of how the
// underlying network stream happens to chunk — this is what makes it read as
// a deliberate robotic typing effect instead of lumpy bursts of text.
function makeTypewriter(el, wordsPerSec = 13){
  let buffer = '', queue = [], displayed = '', ended = false, draining = false;
  function enqueue(text){
    buffer += text;
    const parts = buffer.split(/(\s+)/);
    if(parts.length > 1){
      const trailingPartial = parts[parts.length - 1];
      for(const tok of parts.slice(0, -1)) if(tok) queue.push(tok);
      buffer = trailingPartial;
    }
  }
  async function drain(){
    if(draining) return; draining = true;
    while(queue.length){
      displayed += queue.shift();
      el.innerHTML = escapeHtml(displayed) + '<span class="cursor"></span>';
      await new Promise(r=>setTimeout(r, 1000/wordsPerSec));
    }
    draining = false;
    if(ended && !queue.length) el.innerHTML = escapeHtml(displayed);
  }
  return {
    reset(){ buffer=''; queue=[]; displayed=''; ended=false; el.innerHTML=''; },
    feed(delta){ enqueue(delta); drain(); },
    end(){ ended = true; if(buffer.trim()) queue.push(buffer); buffer=''; drain(); },
  };
}

// decides the turn is over (that timing is untouched — it isn't what was

let queryProcessor=null, queryGain=null, queryChunks=[];
function startQueryRecording(){
  if(!micCtx || queryProcessor) return; // no mic yet, or already recording
  queryChunks = [];
  queryProcessor = micCtx.createScriptProcessor(2048, 1, 1);
  queryGain = micCtx.createGain(); queryGain.gain.value = 0; // silent tap — never routed to speakers
  queryProcessor.onaudioprocess = (e) => queryChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  micSource.connect(queryProcessor);
  queryProcessor.connect(queryGain);
  queryGain.connect(micCtx.destination);
}
function stopQueryRecording(){
  if(!queryProcessor) return null;
  try { micSource.disconnect(queryProcessor); queryProcessor.disconnect(); queryGain.disconnect(); } catch(e){}
  queryProcessor = null; queryGain = null;
  const total = queryChunks.reduce((n,b)=>n+b.length,0);
  if(total < 800) { queryChunks = []; return null; } // too short to be real speech
  const merged = new Float32Array(total);
  let off=0; for(const b of queryChunks){ merged.set(b, off); off += b.length; }
  queryChunks = [];

}
function resampleTo16k(float32, origRate){
  if(origRate === 16000) return float32;
  const ratio = origRate/16000, newLen = Math.round(float32.length/ratio);
  const out = new Float32Array(newLen);
  for(let i=0;i<newLen;i++){
    const s = i*ratio, i0 = Math.floor(s), i1 = Math.min(i0+1, float32.length-1), frac = s-i0;
    out[i] = float32[i0]*(1-frac) + float32[i1]*frac;
  }

}

  const header = new ArrayBuffer(44), dv = new DataView(header);
  const str=(o,s)=>{ for(let i=0;i<s.length;i++) dv.setUint8(o+i, s.charCodeAt(i)); };
  str(0,'RIFF'); dv.setUint32(4,36+pcm.length*2,true); str(8,'WAVE');
  str(12,'fmt '); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,16000,true); dv.setUint32(28,32000,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true);
  str(36,'data'); dv.setUint32(40,pcm.length*2,true);
  return new Blob([header, pcm.buffer], {type:'audio/wav'});
}

let audioReady=false;
let micCtx=null, micSource=null; // hoisted so the query recorder (below) can reuse the same mic stream
async function initAudio(){
  if(audioReady) return; audioReady=true;
  try {
    // Raw, unprocessed signal on purpose: echo cancellation and auto-gain are
    // tuned for voice calls and actively suppress/renormalize sharp transient
    // spikes — exactly what a clap is. Both were very likely eating the
    // signal this detector needs to see clearly.
    const stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const src = ac.createMediaStreamSource(stream);
    micCtx = ac; micSource = src;
    const an = ac.createAnalyser(); an.fftSize=1024; src.connect(an);
    const buf = new Uint8Array(an.fftSize);
    let prevRms=0, cooldown=0;
    // setInterval, not requestAnimationFrame: rAF throttles hard in a
    // background/unfocused tab and shares a queue with the WebGL render loop
    // — both add up to the "clap doesn't wake it, there's a lag" complaint.
    // A dedicated timer keeps sampling at a fixed cadence regardless.
    setInterval(()=>{
      an.getByteTimeDomainData(buf);
      let sum=0; for(let i=0;i<buf.length;i++){ const v=(buf[i]-128)/128; sum+=v*v; }
      const rms=Math.sqrt(sum/buf.length);
      cooldown=Math.max(0,cooldown-1);
      // clap = sharp loud transient after relative quiet — tuned threshold so
      // normal/soft claps wake the orb instantly
      if(!awake && cooldown===0 && rms>0.04 && (rms-prevRms)>0.02){ cooldown=30; wake('clap'); }
      prevRms=prevRms*0.6+rms*0.4;
    }, 20);
    const porcupineActive = await initWakeWordEngine(() => { if(!awake) wake('porcupine'); });
    document.getElementById('wakeprompt').innerHTML = porcupineActive
      ? '👏 clap &nbsp;or&nbsp; 🎙 say “Xyro” &nbsp;to wake<br><span>mic live · wake-word engine active</span>'
      : '👏 clap &nbsp;or&nbsp; 🎙 say “Hello Xyro” &nbsp;to wake<br><span>mic live · or click the orb</span>';
  } catch(e){
    document.getElementById('wakeprompt').innerHTML = '👆 click the orb &nbsp;or&nbsp; press Space &nbsp;to wake<br><span>(enable mic to clap / say “Hello Xyro”)</span>';
  }

  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    try {
      rec=new SR(); rec.continuous=true; rec.interimResults=true; rec.lang='en-US';
      // Only the LATEST result entry, not all of them joined — continuous
      // mode accumulates every utterance since recognition started, and
      // joining them all meant longer sessions kept gluing more and more of
      // the conversation history into "what you just said".
      rec.onresult=(e)=>handleSpeechResult(e.results[e.results.length-1][0].transcript.trim());
      rec.onend=()=>{ if(recWanted){ try{ rec.start(); }catch(e){} } };

// Sign-off detection, ported verbatim from src/voice/signoff.ts (pure
// string/regex logic — same conservative rules as the CLI voice mode).
// Runs BEFORE the brain is asked anything, so a real goodbye costs zero
// tokens and — the actual bug being fixed here — ends the conversation
// instead of re-entering listening forever.
const SIGNOFFS = ["thank you","thanks","bye","goodbye","good night","goodnight","see you","see ya","catch you later","cheers","got it","gotcha","sounds good","sounds great","will do","perfect","great","cool","okay","ok","alright","all right","nice","awesome","right on","that's all","that is all","we're done","done for now","that's it","noted","later"];
const SIGNOFF_STRONG = new Set(["thank you","thanks","bye","goodbye","good night","goodnight","see you","see ya","catch you later","cheers","will do","sounds good","sounds great","that's all","that is all","we're done","done for now","got it"]);
const SIGNOFF_COMMITMENT = /\b(i'?ll|i will|i'?m going to|i am going to|let me)\b/;
const SIGNOFF_COMMAND_VERBS = /\b(send|create|make|build|run|show|give|check|update|write|fix|open|start|schedule|draft|find|search|tell|explain|analyze|review|remind|add|remove|delete|save|deploy|generate|list|read|play)\b/;
const SIGNOFF_QUESTION = /\?|(^|\s)(can|could|would|will|what|when|where|who|why|how|is|are|do|does|should|shall)\s+(you|we|the|there)\b|\b(one more thing|how about|what about|another thing|also)\b/;
const SIGNOFF_FILLERS = new Set(["so","then","for","now","today","tonight","man","really","a","the","that","this","it","its","is","was","and","of","to","i","yeah","yep","fine","good","very","much","do","them","xyro","jarvis","there","everything","all"]);
function isSignOff(raw, isFirstTurn){
  if(isFirstTurn) return {end:false, reason:'first turn'};
  const text = raw.toLowerCase().replace(/[^a-z'? ]+/g,' ').replace(/\s+/g,' ').trim();
  if(!text) return {end:false, reason:'empty'};
  const words = text.split(' ');
  if(words.length > 8) return {end:false, reason:'too long for a goodbye'};
  if(SIGNOFF_QUESTION.test(text)) return {end:false, reason:'question veto'};
  const commits = SIGNOFF_COMMITMENT.test(text);
  if(SIGNOFF_COMMAND_VERBS.test(text) && !commits) return {end:false, reason:'command veto'};
  const matched = SIGNOFFS.filter(p => new RegExp(`(^|\\s)${p}($|\\s)`).test(text));
  if(!matched.length) return {end:false, reason:'no sign-off phrase'};
  const strong = matched.some(p => SIGNOFF_STRONG.has(p)) || commits;
  if(!strong && words.length > 3) return {end:false, reason:'weak positive in a longer sentence'};
  let leftover = ` ${text} `;
  for(const p of [...matched].sort((a,b)=>b.length-a.length)) leftover = leftover.split(` ${p} `).join(' ');
  leftover = leftover.replace(SIGNOFF_COMMITMENT, ' ');
  const content = leftover.split(/\s+/).filter(w => w && w !== "'" && !SIGNOFF_FILLERS.has(w));
  if(content.length >= 2) return {end:false, reason:`continuation veto (${content.join(' ')})`};
  return {end:true, reason:`sign-off: ${matched.join(', ')}`};
}
const SIGNOFF_LINES = ["Going quiet. Ping me when you need me.","Anytime.","Catch you later.","I'll be here."];
let turnCount = 0;

// Named (not inline) so it can also be driven directly for testing via
// window.XYRO.simulateSpeech — real mic input can't be faked remotely.
// Standalone stop/cancel commands — checked BEFORE barge-in. Without this,
// saying "stop" correctly cut the audio (barge-in) but then got forwarded to
// the brain as if it were a real question, which asked something back and
// started talking again — indistinguishable from "it doesn't listen".
const STOP_COMMAND = /^(xyro,?\s*|hey xyro,?\s*)?(stop|cancel|quiet|shut up|that'?s enough|okay stop|please stop|wait,?\s*stop|never ?mind|enough)\.?\s*$/i;

const WAKE_WORD_PATTERN = /(xyro|xylo|zyro|zylo|zero|hero|cairo|xero|zaira|silo|xyra|zira|xiro|sero|syro|tyro|xeyro|zara|sira|jarvis|hello|hey|arey|ari|hi|ok|okay)/i;

function handleSpeechResult(txt){
  if(!awake){
    if(WAKE_WORD_PATTERN.test(txt)){
      // If a real query rode along with the wake word/greeting (e.g. "Hello
      // Xyro, can you write an email"), extract it and answer directly —
      // decide THIS before calling wake(), so wake() knows whether to play
      // its canned greeting (bare wake word) or skip straight to answering
      // (real query attached). Deciding after would be too late: wake()
      // schedules its greeting timers synchronously.
      const clean = txt
        .replace(/^(hello|hey|arey|ari|hi|ok|okay|,|\s)*(xyro|xylo|zyro|zylo|zero|hero|cairo|xero|zaira|silo|xyra|zira|xiro|sero|syro|tyro|xeyro|zara|sira|jarvis)?\s*/i, '')
        .trim();
      if(clean.length >= 2){
        wake('voice', {silent:true});
        queryBuffer = clean;
        setTimeout(finalizeQuery, 500);
      } else {
        wake('voice');
      }
    }
    return;
  }
  if(STOP_COMMAND.test(txt.trim())){
    // Silence immediately, stay awake, and — critically — never forward this
    // to the brain as a question. No confirmation, no delay.
    currentTurnId++;
    stopSpeaking();
    queryBuffer = '';
    clearTimeout(querySilenceTimer);
    clearDraftCaption();
    setState('listening');
    stopQueryRecording(); startQueryRecording(); // discard the stop-phrase's own audio, capture fresh from here
    resetSleepTimer();
    return;
  }
  if(state==='thinking' || state==='speaking'){
    // Barge-in: real speech while Xyro is talking/thinking means "stop and
    // listen to me" — the fix for "it keeps talking when I ask it to stop".
    // Ignore tiny noise blips, but anything substantive cuts playback
    // immediately and starts capturing the new query.
    if(txt.replace(/[^a-z0-9]/gi,'').length < 3) return;
    currentTurnId++; // cancels the in-flight reply's remaining side effects
    stopSpeaking();  // clears the queued/current audio on the voice bridge
    setState('listening');
    startQueryRecording(); // fresh capture for the interrupting utterance
    queryBuffer = txt;
    showCaption(txt, null);
    resetSleepTimer();
    clearTimeout(querySilenceTimer);
    querySilenceTimer = setTimeout(finalizeQuery, QUERY_SILENCE_MS);
    return;
  }
  if(state!=='listening') return; // ignore stray results otherwise (e.g. mid-transition)
  queryBuffer = txt;
  if(txt) showCaption(txt, null); // live caption of what you're saying, as you say it
  resetSleepTimer();
  clearTimeout(querySilenceTimer);
  querySilenceTimer = setTimeout(finalizeQuery, QUERY_SILENCE_MS);
}

async function finalizeQuery(){
  const fallbackText = queryBuffer.trim(); queryBuffer='';
  // Deliberately NOT stopping recognition here anymore: it used to be
  // stopped-then-restarted per turn, but nothing reliably turned it back on
  // except going fully to sleep — recognition (and therefore barge-in, which
  // depends on it running during thinking/speaking) silently died after the
  // first completed turn. It now runs continuously from wake to sleep;
  // reading only the latest result entry (above) keeps that safe.
  // Local whisper.cpp transcript of the actual recorded audio is authoritative
  // when available (far better accuracy); Web Speech's guess is only a
  // fallback if local transcription is unavailable/failed.
  const whisperText = await transcribeRecordedQuery();
  const text = (whisperText || fallbackText).trim();
  if(text.length<2) return;
  clearDraftCaption(); // the draft preview is superseded by the finalized message below
  const verdict = isSignOff(text, turnCount===0);
  turnCount++;
  if(verdict.end){
    addUserMessage(text); // still log what was actually said, even for a goodbye
    const line = SIGNOFF_LINES[Math.floor(Math.random()*SIGNOFF_LINES.length)];
    const tw = addXyroMessage(); tw.feed(line); tw.end();
    speak(line);
    setTimeout(sleep, 1400); // let the goodbye actually play before going dormant
    return;
  }
  addUserMessage(text);
  conversationTurn(text);
}
addEventListener('pointerdown', initAudio, { once:true });
addEventListener('keydown', initAudio, { once:true });

setState('dormant'); tick();

// Debug/test hooks — lets you drive wake/query/sleep without a live mic
// (devtools: XYRO.wake(), XYRO.say("..."), XYRO.sleep())
window.XYRO = {
  wake, sleep, speak, askBrainStream, simulateSpeech: handleSpeechResult, setState,
  say: (text)=>{ const wasAwake=awake; if(!awake) wake('debug', {silent:true}); setTimeout(()=>{ queryBuffer=text; finalizeQuery(); }, wasAwake?0:100); },
  state: ()=>state, isAwake: ()=>awake,
};
</script>
